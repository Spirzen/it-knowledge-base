name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ubuntu-latest ≈ 7 GB RAM; на runner уже может быть /swapfile — свой файл в /mnt.
      - name: Add swap for large Docusaurus build
        run: |
          SWAP=/mnt/docusaurus-swapfile
          sudo swapoff "$SWAP" 2>/dev/null || true
          sudo rm -f "$SWAP"
          if ! sudo fallocate -l 10G "$SWAP" 2>/dev/null; then
            sudo dd if=/dev/zero of="$SWAP" bs=1M count=10240 status=none
          fi
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"
          free -h

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: rm -rf .docusaurus .cache build
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=14336

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - id: deployment
        uses: actions/deploy-pages@v4
