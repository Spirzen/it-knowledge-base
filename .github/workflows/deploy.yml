name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Стандартный runner ≈14 GB диска; Docusaurus + node_modules + swap легко упираются в лимит.
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      # ubuntu-latest ≈ 7 GB RAM; небольшой swap на /mnt после очистки диска.
      - name: Add swap for large Docusaurus build
        run: |
          SWAP=/mnt/docusaurus-swapfile
          sudo swapoff "$SWAP" 2>/dev/null || true
          sudo rm -f "$SWAP"
          if ! sudo fallocate -l 6G "$SWAP" 2>/dev/null; then
            sudo dd if=/dev/zero of="$SWAP" bs=1M count=6144 status=none
          fi
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"
          free -h
          df -h

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: rm -rf .docusaurus .cache build
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=14336

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - id: deployment
        uses: actions/deploy-pages@v4
